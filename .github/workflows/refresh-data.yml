# Weekly refresh: re-run the whole pipeline on fresh City of Edmonton data and
# commit the updated dashboard summaries. Streamlit Community Cloud redeploys
# the dashboard automatically when app/data changes on main.
#
# Order: tests -> extract -> transform -> load -> build summaries -> safety check -> commit.
# Any failing step stops the run, so a broken download never reaches the dashboard.

name: Refresh dashboard data

on:
  schedule:
    # Every Monday at 12:00 UTC (6 AM in Edmonton in summer, 5 AM in winter)
    - cron: "0 12 * * 1"
  workflow_dispatch:   # adds a "Run workflow" button on the Actions tab for manual runs

permissions:
  contents: write      # needed to commit the refreshed files back to the repo

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Extract (download all pages from the City API)
        run: python -m src.extract

      - name: Transform
        run: python -m src.transform

      - name: Load into DuckDB
        run: python -m src.load

      - name: Build dashboard summaries
        run: python -m src.build_dashboard_data

      - name: Safety check and record the refresh date
        run: python -m src.check_refresh

      - name: Commit the refreshed files (only if something changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data/*.parquet app/data/last_refresh.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Refresh dashboard data ($(date -u +%Y-%m-%d))"
            git push
          fi
